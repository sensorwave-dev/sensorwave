# Broker MQTT de federación (NanoMQ).
# DNS privado: sensorwave-mqtt.internal:1884
# Público: tcp://149.248.204.228:1884
# TCP en crudo, sin el proxy TLS de Fly.
#
# See https://fly.io/docs/reference/configuration/

app = 'sensorwave-mqtt'
primary_region = 'gru'

[build]
  image = 'emqx/nanomq:latest'

[env]
  NANOMQ_BROKER_URL = 'nmq-tcp://[::]:1884'

# La imagen ignora NANOMQ_BROKER_URL y, con 0.0.0.0, solo abre IPv4.
# La red privada de Fly es IPv6, así que el listener tiene que ser [::].
[processes]
  app = '/usr/local/nanomq/nanomq start --url nmq-tcp://[::]:1884'

[[services]]
  internal_port = 1884
  protocol = 'tcp'
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 1884

[[vm]]
  memory = '256mb'
  cpus = 1
